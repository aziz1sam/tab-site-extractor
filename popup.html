<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فاصل التبويبات حسب الموقع</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-head">
        <div class="title-group">
          <h1 class="app-title">فاصل التبويبات</h1>
          <span id="summaryText" class="summary-text">جاري الفحص...</span>
        </div>

        <div class="topbar-actions">
          <div class="segmented segmented-compact" role="group" aria-label="طريقة العرض">
            <button type="button" class="seg-btn is-active" data-view="list" aria-pressed="true">
              قائمة
            </button>
            <button type="button" class="seg-btn" data-view="tiles" aria-pressed="false">
              بلاطات
            </button>
          </div>

          <button
            id="settingsBtn"
            type="button"
            class="icon-btn"
            aria-expanded="false"
            aria-label="إعدادات المميزات"
            title="تخصيص وتفعيل المميزات"
          >
            ⚙️
          </button>
        </div>
      </div>

      <!-- لوحة إعدادات تفعيل/إيقاف المميزات -->
      <section id="settingsPanel" class="settings-panel" aria-label="إعدادات المميزات" hidden>
        <div class="settings-head">
          <span class="settings-title">تفعيل أو إيقاف المميزات</span>
        </div>
        <div class="settings-grid">
          <label class="setting-item">
            <input type="checkbox" class="chk" data-feature="quickFilters" checked>
            <span>الفلاتر السريعة وتنظيف المكرر (📌/🔊/📑)</span>
          </label>
          <label class="setting-item">
            <input type="checkbox" class="chk" data-feature="windowTargetAndMerge" checked>
            <span>اختيار نافذة الوجهة وزر دمج النوافذ (🗗)</span>
          </label>
          <label class="setting-item">
            <input type="checkbox" class="chk" data-feature="tabGroups" checked>
            <span>تجميع داخل نفس النافذة (🗂️ Tab Groups)</span>
          </label>
          <label class="setting-item">
            <input type="checkbox" class="chk" data-feature="hibernateTabs" checked>
            <span>تجميد التبويبات لتحرير الذاكرة (❄️ RAM)</span>
          </label>
          <label class="setting-item">
            <input type="checkbox" class="chk" data-feature="copyTools" checked>
            <span>أزرار نسخ الروابط (🔗 URLs / Markdown)</span>
          </label>
          <label class="setting-item">
            <input type="checkbox" class="chk" data-feature="livePreview" checked>
            <span>شريط معاينة النافذة الجديدة</span>
          </label>
        </div>
      </section>

      <div class="controls-strip">
        <div class="segmented" role="group" aria-label="نطاق التبويبات">
          <button type="button" class="seg-btn is-active" data-scope="current" aria-pressed="true">
            النافذة الحالية
          </button>
          <button type="button" class="seg-btn" data-scope="all" aria-pressed="false">
            جميع النوافذ
          </button>
        </div>

        <div class="segmented" role="group" aria-label="طريقة التجميع">
          <button type="button" class="seg-btn is-active" data-grouping="main" aria-pressed="true">
            النطاق الرئيسي
          </button>
          <button type="button" class="seg-btn" data-grouping="subdomain" aria-pressed="false">
            النطاق الفرعي
          </button>
        </div>
      </div>

      <div class="search-row">
        <div class="search-field">
          <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="5.75" stroke="currentColor" stroke-width="1.6"/>
            <path d="M13.5 13.5L17 17" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="ابحث عن موقع أو عنوان (أو is:audible)"
            autocomplete="off"
            aria-label="ابحث عن موقع أو عنوان"
          >
          <button
            id="clearSearchBtn"
            type="button"
            class="clear-search-btn"
            aria-label="مسح البحث"
            hidden
          >
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M4.5 4.5L11.5 11.5M11.5 4.5L4.5 11.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <button id="selectAllBtn" type="button" class="bulk-btn">
          تحديد الكل
        </button>
      </div>

      <!-- شريط الفلاتر السريعة + زر تحديد النسخ الزائدة فقط -->
      <div id="filterPillsRow" class="filter-pills-row" role="group" aria-label="فلاتر سريعة">
        <button type="button" class="filter-pill" data-filter="pinned" aria-pressed="false" title="عرض التبويبات المثبتة فقط (is:pinned)">
          <span>📌 مثبّت</span>
          <span id="countPinned" class="pill-count">0</span>
        </button>
        <button type="button" class="filter-pill" data-filter="audible" aria-pressed="false" title="عرض التبويبات الصوتية (is:audible)">
          <span>🔊 صوت</span>
          <span id="countAudible" class="pill-count">0</span>
        </button>
        <button type="button" class="filter-pill" data-filter="duplicated" aria-pressed="false" title="عرض التبويبات المكررة (نقر مزدوج لتحديد الزائد فقط)">
          <span>📑 مكرر</span>
          <span id="countDuplicated" class="pill-count">0</span>
        </button>
        <button
          id="cleanDuplicatesBtn"
          type="button"
          class="clean-dup-btn"
          title="تحديد النسخ المكررة الزائدة فقط مع ترك النسخة الأصلية الأولى سليمة"
          hidden
        >
          🧹 تحديد الزائد (<span id="countDuplicateCopies">0</span>)
        </button>
      </div>
    </header>

    <div id="statusBanner" class="status-banner" role="status" aria-live="polite" hidden></div>

    <main id="siteListContainer" class="ledger-wrap">
      <ul id="siteList" class="site-list" aria-label="قائمة المواقع المفتوحة"></ul>

      <div id="emptyState" class="empty-state" hidden>
        <p id="emptyMessage" class="empty-message"></p>
        <button id="emptyActionBtn" type="button" class="empty-action-btn" hidden>
          مسح البحث والفلاتر
        </button>
      </div>
    </main>

    <section id="previewStrip" class="preview-strip" aria-label="معاينة النافذة الجديدة" hidden>
      <div class="preview-head">
        <span class="preview-title">معاينة التبويبات المحددة</span>
        <span id="previewMeta" class="preview-meta"></span>
      </div>
      <div id="previewTabs" class="preview-tabs" role="list"></div>
    </section>

    <footer class="action-bar">
      <div id="windowWarning" class="window-warning" role="alert" hidden></div>

      <!-- شريط وجهة النقل ودمج النوافذ -->
      <div id="windowTargetRow" class="window-target-row">
        <label class="target-label" for="targetWindowSelect">نقل إلى:</label>
        <select id="targetWindowSelect" class="target-select" aria-label="وجهة نقل التبويبات">
          <option value="new">نافذة جديدة مستقلة</option>
        </select>
        <button
          id="mergeWindowsBtn"
          type="button"
          class="util-btn merge-btn"
          title="دمج جميع النوافذ العادية المفتوحة في النافذة الحالية"
          hidden
        >
          🗗 دمج النوافذ
        </button>
      </div>

      <div class="action-buttons">
        <button id="extractBtn" type="button" class="btn-extract" disabled>
          استخراج في نافذة جديدة (0)
        </button>
        <button id="closeTabsBtn" type="button" class="btn-close-tabs" disabled>
          إغلاق المحدد (0)
        </button>
      </div>

      <div class="utility-bar">
        <div class="smart-actions">
          <button
            id="groupTabsBtn"
            type="button"
            class="util-btn"
            disabled
            title="تجميع التبويبات المحددة في مجموعة كروم ملونة باسم الموقع داخل نفس النافذة"
          >
            🗂️ تجميع
          </button>
          <button
            id="hibernateTabsBtn"
            type="button"
            class="util-btn"
            disabled
            title="تجميد التبويبات المحددة لتحرير الذاكرة (RAM) مع إبقائها مفتوحة"
          >
            ❄️ تجميد
          </button>
          <button
            id="copyUrlsBtn"
            type="button"
            class="util-btn"
            disabled
            title="نسخ روابط التبويبات المحددة (Ctrl+C)"
          >
            🔗 نسخ
          </button>
          <button
            id="copyMarkdownBtn"
            type="button"
            class="util-btn"
            disabled
            title="نسخ الروابط بصيغة Markdown (Ctrl+Shift+C)"
          >
            📝 MD
          </button>
        </div>

        <div class="shortcuts-bar" aria-hidden="true">
          <span><kbd class="kbd">Enter</kbd> نقل</span>
          <span><kbd class="kbd">Del</kbd> إغلاق</span>
        </div>
      </div>
    </footer>
  </div>

  <script src="domain-utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
